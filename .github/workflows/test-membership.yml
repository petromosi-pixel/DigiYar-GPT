name: DigiYar membership preview tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/v8-membership-plans.js'
      - 'css/v8-membership-plans.css'
      - 'tests/v8-membership-plans.test.mjs'
      - 'tests/v8-membership-navigation.test.mjs'
      - 'api/membership/access.js'
      - 'api/membership/checkout.js'
      - 'api/membership/zarinpal/verify.js'
      - 'api/_lib/membership-pricing.js'
      - 'api/_lib/zarinpal.js'
      - 'api/_lib/membership-http.js'
      - 'tests/v8-membership-payments.test.mjs'
      - 'supabase/sql/membership-payments-zarinpal.sql'
      - 'api/_lib/membership-entitlements.js'
      - 'supabase/sql/membership-subscriptions.sql'
      - 'package.json'
      - '.github/workflows/test-membership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  membership-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tier, duration, and no-payment contract
        run: npm run test:v8:membership

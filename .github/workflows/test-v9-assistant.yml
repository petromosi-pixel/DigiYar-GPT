name: Hooshyar V9 assistant contract

on:
  push:
    branches: [main]
    paths:
      - 'js/v9-hooshyar-assistant.js'
      - 'js/v8-product-result-source.js'
      - 'sw.js'
      - 'index.html'
      - 'tests/v9-hooshyar-assistant.test.mjs'
      - 'package.json'
      - '.github/workflows/test-v9-assistant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run central assistant contract
        run: npm run test:v9:assistant

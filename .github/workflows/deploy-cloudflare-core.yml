name: Deploy DigiYar V6 Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'js/data-ingestion-v5.1.js'
      - 'js/search-core-v5.1.js'
      - 'js/v5-price-availability-resolver.js'
      - 'js/hmyar-engine.js' # V7 Hamyar live engine
      - 'js/v5-offer-affiliate-engine.js'
      - 'js/product-index-generated-v5.1.js'
      - 'js/*-product-index-v5.1.js'
      - 'data/catalog/**'
      - 'data/category-registry-v5.1.json'
      - 'wrangler.jsonc'
      - 'tests/v5.1-smart-search-contract.test.mjs'
      - '.github/workflows/deploy-cloudflare-core.yml'
      - '.github/workflows/catalog-ingest-v5.1.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify Wrangler
        run: wrangler --version

      - name: Deploy DigiYar V6 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.jsonc

      - name: Wait for live V6 Worker readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              -H 'accept: application/json' \
              'https://digiyar-v6.petromosi.workers.dev/health' \
              | grep -q '"status":"ok"'; then
              echo "Live V6 Worker is ready (attempt ${attempt})."
              exit 0
            fi
            echo "Worker not ready yet (attempt ${attempt}/30); waiting 2s..."
            sleep 2
          done
          echo 'Live V6 Worker did not become ready after deployment.'
          exit 1

      - name: Smoke-test Worker resolver proxy
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_URL='https://torobshop.com/products/MEDION-Beast-18-QHD-Core-Ultra-9-275HX-9-9-%D9%86%D9%88%D8%AA-%D8%A8%D9%88%DA%A9-Core-Ultra-9-30039675'
          curl --fail --silent --show-error --max-time 45 \
            -G 'https://digiyar-v6.petromosi.workers.dev/api/resolve' \
            --data-urlencode "url=${PRODUCT_URL}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s); console.log(JSON.stringify({success:d.success,resolved:d.resolved,priceToman:d.priceToman,availability:d.availability,extraction:d.extraction},null,2)); if(!d.success||!d.resolved||!(Number(d.priceToman)>0)) process.exit(1);})'

      - name: Inspect live V6 smart-search payload
        shell: bash
        run: |
          set -euo pipefail
          for query in \
            'گوشی سامسونگ تا ۵۰۰ میلیون تومان می‌خوام' \
            'دنبال یه لپ تاپ دانشجویی می‌گردم'; do
            echo "===== V6 SMART SEARCH: ${query} ====="
            curl --fail --silent --show-error --max-time 30 \
              -G 'https://digiyar-v6.petromosi.workers.dev/api/search' \
              --data-urlencode "q=${query}" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s); console.log(JSON.stringify({source:d.source,total:d.total,parsed:d.parsed,sample:(d.results||[]).slice(0,5).map(x=>({name:x.name,price:x.price,priceToman:x.priceToman,currency:x.currency,productUrl:x.productUrl,affiliateUrl:x.affiliateUrl,store:x.storeId||x.store}))},null,2))})'
          done

      - name: Run V5.1 Smart Search contract gate
        run: npm run test:v5.1:smart-search

      - name: Run V5.1 Revenue E2E gate
        run: npm run test:v5.1:revenue

      - name: Run V5.1 Full Mission E2E gate
        run: npm run test:v5.1:mission

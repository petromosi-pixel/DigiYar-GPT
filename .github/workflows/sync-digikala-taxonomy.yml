name: Sync Digikala Taxonomy

on:
  push:
    branches: [v6-digikala-taxonomy-isolated]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v6-digikala-taxonomy-isolated
          fetch-depth: 0

      - name: Sync taxonomy
        run: node scripts/sync-digikala-taxonomy.mjs

      - name: Commit generated taxonomy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digikala-category-tree.json
          if git diff --cached --quiet; then
            echo 'No taxonomy changes.'
            exit 0
          fi
          git commit -m 'chore(v6): refresh isolated Digikala taxonomy'
          git push origin v6-digikala-taxonomy-isolated

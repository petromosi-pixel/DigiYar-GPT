name: Hooshyar V8 regression

on:
  push:
    branches: [main]
    paths:
      - 'js/v8-hooshyar-engine.js'
      - 'js/v8-persian-language-dictionary.js'
      - 'js/v8-store-catalog.js'
      - 'js/v8-store-search-url.js'
      - 'js/v8-product-result-source.js'
      - 'js/v8-product-result-producer.js'
      - 'js/v8-splash.js'
      - 'js/v8-ui.js'
      - 'js/v8-step4-final.js'
      - 'js/v8-step4-patch.js'
      - 'js/v8-footer.js'
      - 'js/v8-taxonomy-controller.js'
      - 'js/v8-store-select-sync.js'
      - 'js/v8-multi-store-picker.js'
      - 'js/v6-site-taxonomy-overrides.js'
      - 'js/v6-stores-26-30-taxonomy.js'
      - 'js/v6-stores-21-25-taxonomy.js'
      - 'js/v6-product-options.js'
      - 'tests/v8-multi-store-selection.test.mjs'
      - 'css/v8-base.css'
      - 'css/v8-splash.css'
      - 'css/v8-step2-header.css'
      - 'css/v8-ui.css'
      - 'css/v8-step4.css'
      - 'css/v8-step4-toggle-direction.css'
      - 'css/v8-smart-search.css'
      - 'js/v8-hooshyar-input.js'
      - 'css/v8-hooshyar.css'
      - 'index.html'
      - 'sw.js'
      - 'tests/v8-hooshyar-relevance.test.mjs'
      - 'tests/v8-persian-language-dictionary.test.mjs'
      - 'tests/v8-store-taxonomy-audit.test.mjs'
      - 'tests/v8-store-search-routes.test.mjs'
      - 'tests/v8-store-search-routes-live.test.mjs'
      - 'tests/v8-hamburger-directory.test.mjs'
      - 'js/user-profile.js'
      - 'tests/v8-hooshyar-theme-contract.test.mjs'
      - 'tests/v8-hooshyar-independent-search.test.mjs'
      - 'tests/v8-hooshyar-independent-search.test.mjs'
      - 'tests/v8-product-result-source.test.mjs'
      - 'tests/v8-product-result-producer.test.mjs'
      - 'package.json'
      - '.github/workflows/test-v8-hooshyar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Persian dictionary and synonym relevance checks
        run: npm run test:v8:persian-dictionary
      - name: Run Hooshyar V8 checks
        run: npm run test:v8:hooshyar
      - name: Smoke-test live merchant search routes
        run: npm run test:v8:store-search-routes:live

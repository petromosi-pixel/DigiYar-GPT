 <rect x="218" y="165" width="278" height="172" rx="84" fill="url(#robot-visor)" stroke="#8fb8e8" stroke-width="3"/>
 <path d="M250 190Q300 172 360 176" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".18"/>
 <g class="eyes" fill="none" stroke="#5ff2ff" stroke-width="10" stroke-linecap="round" filter="url(#robot-glow)"><path d="M257 275A27 27 0 0 1 311 275"/><path d="M401 275A27 27 0 0 1 455 275"/></g>
 <path fill="#5ff2ff" stroke="#5ff2ff" stroke-width="3" stroke-linejoin="round" filter="url(#robot-glow)" d="M326 301C336 313 370 313 380 301C370 307 336 307 326 301Z"><animate attributeName="d" dur="3.6s" repeatCount="indefinite" values="M326 301C336 313 370 313 380 301C370 307 336 307 326 301Z;M328 300C332 330 374 330 378 300C366 294 340 294 328 300Z;M340 300C342 316 364 316 366 300C360 297 346 297 340 300Z;M326 301C336 313 370 313 380 301C370 307 336 307 326 301Z"/></path>
</g>
</svg>
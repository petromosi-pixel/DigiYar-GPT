  <line x1="478" y1="432" x2="540" y2="520" stroke="url(#robot-white)" stroke-width="48" stroke-linecap="round"/>
  <ellipse cx="482" cy="425" rx="50" ry="30" transform="rotate(35 482 425)" fill="url(#robot-blue)"/>
  <g fill="url(#robot-blue)" stroke="#0a2a66" stroke-width="2"><ellipse cx="552" cy="548" rx="34" ry="28" transform="rotate(25 552 548)"/><circle cx="584" cy="556" r="14"/><circle cx="572" cy="580" r="14"/><circle cx="548" cy="582" r="14"/><circle cx="566" cy="526" r="14"/></g>
  <circle cx="545" cy="548" r="7" fill="#5ff2ff" filter="url(#robot-glow)"/>
 </g>

  <rect x="318" y="456" width="68" height="68" rx="10" fill="#0a2f80" stroke="#8fe3ff" stroke-width="4" filter="url(#robot-glow)"/>
  <text x="352" y="505" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#fff" stroke="none">AI</text>
 </g>

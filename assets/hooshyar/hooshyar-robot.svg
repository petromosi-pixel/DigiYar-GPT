<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 820" role="img" aria-labelledby="title desc">
<title id="title">ربات متحرک هوش‌یار</title>
<desc id="desc">ربات هوش‌یار با حرکت شناور، پلک زدن و هولوگرام زیر پا</desc>
<defs>
 <linearGradient id="robot-white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9d6e6"/></linearGradient>
 <linearGradient id="robot-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#0b3fa8"/></linearGradient>
 <linearGradient id="robot-visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a44"/><stop offset="1" stop-color="#03060f"/></linearGradient>
 <radialGradient id="robot-holo"><stop offset="0" stop-color="#7fd0ff" stop-opacity=".8"/><stop offset="1" stop-color="#1e7bff" stop-opacity="0"/></radialGradient>
 <filter id="robot-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.float{animation:robotFloat 4s cubic-bezier(.45,0,.55,1) infinite}.eyes{transform-box:fill-box;transform-origin:center;animation:robotBlink 4s infinite}.holo{transform-box:fill-box;transform-origin:center;animation:robotHolo 4s cubic-bezier(.45,0,.55,1) infinite}.ring{transform-box:fill-box;transform-origin:center;animation:robotRing 2s ease-out infinite}.armL{transform-box:view-box;transform-origin:228px 430px;animation:robotArmL 4s ease-in-out infinite}.armR{transform-box:view-box;transform-origin:478px 430px;animation:robotArmR 4s ease-in-out infinite}.pulse{animation:robotPulse 1.6s ease-in-out infinite}.chip{animation:robotPulse 2.4s ease-in-out infinite}
@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-38px)}}@keyframes robotBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}@keyframes robotHolo{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.6}}@keyframes robotRing{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.15);opacity:0}}@keyframes robotArmL{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}@keyframes robotArmR{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}@keyframes robotPulse{0%,100%{opacity:1}50%{opacity:.45}}
</style>
<g class="holo">

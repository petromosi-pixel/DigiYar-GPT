 <rect x="198" y="225" width="14" height="74" rx="7" fill="#d8e4f3"/><rect x="502" y="225" width="14" height="74" rx="7" fill="#d8e4f3"/>
 <path d="M205 250Q205 105 355 100Q505 105 505 250Q505 370 355 375Q205 370 205 250Z" fill="url(#robot-white)" stroke="#aebfd6" stroke-width="2"/>
 <path d="M300 104Q355 92 410 104Q355 118 300 104Z" fill="url(#robot-blue)"/>

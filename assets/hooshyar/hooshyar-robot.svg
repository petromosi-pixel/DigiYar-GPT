 <ellipse cx="350" cy="738" rx="85" ry="17" fill="none" stroke="#7fd0ff" stroke-width="3" opacity=".9"/>
 <ellipse cx="350" cy="738" rx="45" ry="9" fill="none" stroke="#bfe8ff" stroke-width="2.5" opacity=".9"/>
 <ellipse class="ring" cx="350" cy="738" rx="125" ry="26" fill="none" stroke="#5cc0ff" stroke-width="2"/>
</g>
<g class="float">
 <line x1="364" y1="98" x2="364" y2="42" stroke="#1a3a73" stroke-width="6" stroke-linecap="round"/>
 <circle class="pulse" cx="364" cy="30" r="13" fill="#5ff2ff" filter="url(#robot-glow)"/>
